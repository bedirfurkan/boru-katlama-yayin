name: Sürümü yayınla

# Sürüm dosyaları "yukle/vX.Y.Z" dalıyla gelir (özel depodaki derleme iş akışı ya da yerel yayın betiği gönderir).
# Dalın "yukle/" klasöründeki dosyalar vX.Y.Z sürümüne eklenir: sürüm yoksa oluşturulur ("latest" olur), varsa dosyalar eklenir/yenilenir.
#   Windows: BoruKatlama.exe + surum.json        macOS: BoruKatlama-X.Y.Z-macos.zip + surum-macos.json        notlar.md: sürüm notları
# Böylece macOS ve Windows dosyaları farklı zamanlarda aynı sürüme eklenebilir. Programlar güncelleme kaynağı olarak
# "latest" sürümdeki surum.json (Windows) / surum-macos.json (macOS) dosyasına bakar; bildirimler imzalıdır.
on:
  push:
    branches: ['yukle/**']

permissions:
  contents: write

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#yukle/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Etiket biçimi geçersiz: $tag"; exit 1; }
          [ -d yukle ] || { echo "::error::yukle/ klasörü yok"; exit 1; }
          dosyalar=()
          for f in yukle/*; do
            [ "$(basename "$f")" = notlar.md ] && continue
            [ -s "$f" ] || { echo "::error::$f boş"; exit 1; }
            dosyalar+=("$f")
          done
          [ ${#dosyalar[@]} -gt 0 ] || { echo "::error::yüklenecek dosya yok"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${dosyalar[@]}" --clobber
          else
            args=(--title "Boru Katlama Stüdyosu $tag" --latest)
            if [ -s yukle/notlar.md ]; then args+=(--notes-file yukle/notlar.md); else args+=(--notes "Boru Katlama Stüdyosu $tag"); fi
            gh release create "$tag" "${dosyalar[@]}" "${args[@]}"
          fi
          git push origin --delete "$GITHUB_REF_NAME" || true
